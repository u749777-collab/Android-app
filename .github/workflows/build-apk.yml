name: Build Android APK
​
on:
  workflow_dispatch:
  push:
    branches: [main]
​
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
​
    defaults:
      run:
        working-directory: dayflow-app
​
    steps:
      - name: Checkout
        uses: actions/checkout@v4
​
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
​
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
​
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
​
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
​
      - name: Debug — показать файлы
        run: |
          echo "=== Текущая папка ==="
          pwd
          echo "=== Файлы ==="
          ls -la
          echo "=== package.json ==="
          if [ -f package.json ]; then
            echo "OK: package.json найден"
          else
            echo "ОШИБКА: package.json не найден"
            exit 1
          fi
​
      - name: Install dependencies
        run: npm install --legacy-peer-deps
​
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
​
      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias dayflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dayflow123 \
            -keypass dayflow123 \
            -dname "CN=DayFlow, O=DayFlow, C=RU"
​
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=dayflow123 \
            -Pandroid.injected.signing.key.alias=dayflow \
            -Pandroid.injected.signing.key.password=dayflow123 \
            --no-daemon --stacktrace
​
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/DayFlow.apk
​
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-apk
          path: dayflow-app/out/DayFlow.apk
          retention-days: 30
