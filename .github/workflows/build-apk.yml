name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # нужно для upload-sarif

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: dayflow-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias dayflow \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dayflow123 -keypass dayflow123 \
            -dname "CN=DayFlow, O=DayFlow, C=RU"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=dayflow123 \
            -Pandroid.injected.signing.key.alias=dayflow \
            -Pandroid.injected.signing.key.password=dayflow123 \
            --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/DayFlow.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-apk
          path: dayflow-app/out/DayFlow.apk
          retention-days: 30

      # ---------- Appknox ----------
      - name: Appknox scan
        id: appknox
        continue-on-error: true          # чтобы не валить сборку из-за security-отчёта
        uses: appknox/appknox-github-action@b7d2bfb2321d5544e97bffcba48557234ab953a4
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          # путь считается от корня репозитория (не от working-directory!)
          file_path: dayflow-app/android/app/build/outputs/apk/release/app-release.apk
          risk_threshold: MEDIUM
          sarif: Enable

      - name: Verify report.sarif
        if: always()
        run: |
          echo "PWD: $(pwd)"
          ls -la "${{ github.workspace }}" | grep -i sarif || echo "report.sarif НЕ найден"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          # SARIF создаётся в корне workspace, а не в dayflow-app
          sarif_file: ${{ github.workspace }}/report.sarif
