name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug — показать файлы в корне
        run: |
          echo "=== Текущая папка ==="
          pwd
          echo "=== Файлы в корне ==="
          ls -la
          echo "=== Поиск package.json ==="
          find . -name "package.json" -not -path "./node_modules/*"
          echo "=== Проверка package.json ==="
          if [ -f package.json ]; then
            echo "package.json найден"
            cat package.json | head -30
          else
            echo "ОШИБКА: package.json не найден в корне!"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/DayFlow.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-apk
          path: out/DayFlow.apk
          retention-days: 30
